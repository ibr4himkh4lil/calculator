<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    }
    .calculator {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    .display {
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      height: 180px;
      padding: 0 15px 15px;
    }
    #display {
      width: 100%;
      background: none;
      border: none;
      outline: none;
      text-align: right;
      color: #fff;
      font-size: 80px;
      font-weight: 300;
      overflow-x: auto;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    button {
      height: 80px;
      border: none;
      border-radius: 50%;
      font-size: 30px;
      font-weight: 400;
      cursor: pointer;
      color: #fff;
      transition: filter 0.1s;
    }
    button:active {
      filter: brightness(1.6);
    }
    .num {
      background: #333333;
    }
    .func {
      background: #a5a5a5;
      color: #000;
    }
    .op {
      background: #ff9f0a;
    }
    .op.active {
      background: #fff;
      color: #ff9f0a;
    }
    button.zero {
      grid-column: span 2;
      border-radius: 80px;
      text-align: left;
      padding-left: 32px;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <input type="text" id="display" value="0" disabled>
    </div>
    <div class="buttons">
      <button class="func" onclick="action('clear')">AC</button>
      <button class="func" onclick="action('sign')">+/−</button>
      <button class="func" onclick="action('percent')">%</button>
      <button class="op" id="op-divide" onclick="action('operator', '/')">÷</button>

      <button class="num" onclick="action('number', '7')">7</button>
      <button class="num" onclick="action('number', '8')">8</button>
      <button class="num" onclick="action('number', '9')">9</button>
      <button class="op" id="op-multiply" onclick="action('operator', '*')">×</button>

      <button class="num" onclick="action('number', '4')">4</button>
      <button class="num" onclick="action('number', '5')">5</button>
      <button class="num" onclick="action('number', '6')">6</button>
      <button class="op" id="op-subtract" onclick="action('operator', '-')">−</button>

      <button class="num" onclick="action('number', '1')">1</button>
      <button class="num" onclick="action('number', '2')">2</button>
      <button class="num" onclick="action('number', '3')">3</button>
      <button class="op" id="op-add" onclick="action('operator', '+')">+</button>

      <button class="num zero" onclick="action('number', '0')">0</button>
      <button class="num" onclick="action('decimal')">.</button>
      <button class="op" id="op-equals" onclick="action('equals')">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    let current = '0';
    let previous = null;
    let operator = null;
    let waiting = false;
    let justEvaluated = false;

    function render() {
      let text = current;
      if (text.length > 9) {
        const num = parseFloat(text);
        text = num.toExponential(6).replace('+', '');
      }
      display.value = text;
    }

    function resetActiveOp() {
      document.querySelectorAll('.op').forEach(b => b.classList.remove('active'));
    }

    function action(type, value) {
      if (type === 'number') {
        if (justEvaluated) { current = '0'; justEvaluated = false; }
        if (waiting) { current = value; waiting = false; }
        else if (current === '0') { current = value; }
        else current += value;
        resetActiveOp();
      } else if (type === 'decimal') {
        if (justEvaluated) { current = '0'; justEvaluated = false; }
        if (waiting) { current = '0.'; waiting = false; }
        else if (!current.includes('.')) current += '.';
        resetActiveOp();
      } else if (type === 'operator') {
        if (operator && !waiting && !justEvaluated) {
          compute();
        }
        previous = current;
        operator = value;
        waiting = true;
        justEvaluated = false;
        resetActiveOp();
        document.getElementById('op-' + { '/': 'divide', '*': 'multiply', '-': 'subtract', '+': 'add' }[value]).classList.add('active');
      } else if (type === 'equals') {
        if (operator && previous !== null && !waiting) {
          compute();
        }
        resetActiveOp();
        justEvaluated = true;
      } else if (type === 'clear') {
        current = '0';
        previous = null;
        operator = null;
        waiting = false;
        justEvaluated = false;
        resetActiveOp();
      } else if (type === 'sign') {
        current = String(parseFloat(current) * -1);
      } else if (type === 'percent') {
        current = String(parseFloat(current) / 100);
      }
      render();
    }

    function compute() {
      const a = parseFloat(previous);
      const b = parseFloat(current);
      let result;
      switch (operator) {
        case '+': result = a + b; break;
        case '-': result = a - b; break;
        case '*': result = a * b; break;
        case '/': result = b === 0 ? 'Error' : a / b; break;
      }
      current = String(result);
      previous = null;
      operator = null;
      waiting = false;
    }
  </script>
</body>
</html>
